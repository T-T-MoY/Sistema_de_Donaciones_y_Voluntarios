# =============================================
# SonarQube - Frontend (React / TypeScript / Vite)
# =============================================

# Identificador único del proyecto en SonarQube
sonar.projectKey=donaciones-frontend
sonar.projectName=donaciones-frontend
sonar.projectVersion=1.0

# Directorio raíz del análisis (relativo a este archivo)
sonar.sources=src

# Excluir carpetas que no deben analizarse
sonar.exclusions=node_modules/**,dist/**,public/**,**/*.spec.tsx,**/*.test.tsx,**/*.spec.ts,**/*.test.ts

# Archivos de tests (cuando los tengas)
# sonar.tests=src
# sonar.test.inclusions=**/*.spec.tsx,**/*.test.tsx,**/*.spec.ts,**/*.test.ts

# Lenguaje principal
sonar.language=ts

# Codificación de los archivos fuente
sonar.sourceEncoding=UTF-8

# --- Cobertura de tests (habilitar cuando tengas tests con Vitest) ---
# sonar.typescript.lcov.reportPaths=coverage/lcov.info
# sonar.testExecutionReportPaths=coverage/test-reporter.xml

# --- Conexión al servidor SonarQube ---
# IMPORTANTE: NO guardes el token aquí, pásalo por variable de entorno
# o por parámetro al correr el scanner: -Dsonar.token=TU_TOKEN
sonar.host.url=http://localhost:9000
